</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>🏠 Lagos Rent Splitter 2026</h2><p style="color:#888;font-size:11px">Agent 10% + Agreement 10% + Caution 10% + Legal 5% + Damages</p>
