<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="monetag" content="7c196691a3e21ac5aec6567991b655c2">
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>Delivery Fee - Map + Share</title>
<style>
body{margin:0;background:#060606;color:#fff;font-family:Arial}
.header{padding:15px}
#map{height:50vh;width:100%;border-bottom:2px solid #00d9ff}
.card{background:#111;border:1px solid #1d1d1d;border-radius:16px;padding:14px;margin:10px}
select,input,button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #222;background:#0a0a0a;color:#fff;box-sizing:border-box}
.btn-main{background:#00d9ff;color:#000;font-weight:bold;border:0;font-size:16px}
.btn-wa{background:#25D366;color:#000;font-weight:bold;border:0;font-size:16px;display:none}
.result{background:#00ff88;color:#000;padding:18px;border-radius:16px;text-align:center;font-weight:bold;font-size:20px;margin-top:10px;display:none}
small{color:#888}
</style>
</head>
<body>
<div class="header">
<a href="/" style="color:#00ff88;text-decoration:none">← System</a>
<h2 style="margin:10px 0 0">Delivery Fee 🛵 Map</h2>
<small>Tap map: 1st tap = FROM, 2nd tap = TO. Drag pins to adjust.</small>
</div>

<div id="map"></div>

<div class="card">
<label>Item Size</label>
<select id="item">
<option value="100">Small - ₦100 /km</option>
<option value="150" selected>Medium - ₦150 /km</option>
<option value="220">Large - ₦220 /km</option>
<option value="300">Very Large / Fragile - ₦300 /km</option>
</select>
<input id="base" type="number" value="500" placeholder="Base fee e.g. 500">
<button class="btn-main" onclick="calc()">CALCULATE FEE</button>
<div id="res" class="result"></div>
<small id="dist" style="display:block;text-align:center;margin-top:8px"></small>
<button id="waBtn" class="btn-wa" onclick="shareWA()">Share to Customer on WhatsApp</button>
<button onclick="clearMap()" style="background:#222;color:#fff">Clear Map</button>
</div>

<script>
let map = L.map('map').setView([9.057,7.495], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);
let fromMarker=null,toMarker=null,line=null,fromLatLng=null,toLatLng=null,step=0,lastFee=0,lastDist=0;

map.on('click', e=>{
 if(step===0){
   if(fromMarker) map.removeLayer(fromMarker);
   fromMarker = L.marker(e.latlng,{draggable:true}).addTo(map).bindPopup("FROM - Shop").openPopup();
   fromLatLng=e.latlng; fromMarker.on('dragend', ev=>{fromLatLng=ev.target.getLatLng();updateLine();}); step=1;
 } else {
   if(toMarker) map.removeLayer(toMarker);
   toMarker = L.marker(e.latlng,{draggable:true}).addTo(map).bindPopup("TO - Customer").openPopup();
   toLatLng=e.latlng; toMarker.on('dragend', ev=>{toLatLng=ev.target.getLatLng();updateLine();}); step=0; updateLine();
 }
});

function getDistance(l1,l2){
 let R=6371, dLat=(l2.lat-l1.lat)*Math.PI/180, dLon=(l2.lng-l1.lng)*Math.PI/180;
 let a=Math.sin(dLat/2)**2+Math.cos(l1.lat*Math.PI/180)*Math.cos(l2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function updateLine(){
 if(fromLatLng&&toLatLng){
   if(line) map.removeLayer(line);
   line=L.polyline([fromLatLng,toLatLng],{color:'#00d9ff',weight:5}).addTo(map);
   let d=getDistance(fromLatLng,toLatLng);
   lastDist=d;
   document.getElementById('dist').innerText=`Distance: ${d.toFixed(2)} km | Drag pins to adjust`;
 }
}

function calc(){
 if(!fromLatLng||!toLatLng){ alert('Tap map to set FROM and TO first'); return; }
 let d=getDistance(fromLatLng,toLatLng);
 let rate=parseInt(document.getElementById('item').value);
 let base=parseInt(document.getElementById('base').value)||0;
 let fee=Math.ceil((base+d*rate)/100)*100;
 lastFee=fee; lastDist=d;
 let res=document.getElementById('res');
 res.style.display='block';
 res.innerHTML=`Distance: ${d.toFixed(2)}km<br>Fee: ₦${fee.toLocaleString()}`;
 document.getElementById('waBtn').style.display='block';
}

function shareWA(){
 let itemText=document.getElementById('item').options[document.getElementById('item').selectedIndex].text;
 let msg=`*Delivery Fee Breakdown* 🛵\n\n📍 From: Shop Location\n📍 To: Customer Location\n📏 Distance: ${lastDist.toFixed(2)}km\n📦 Item: ${itemText}\n💰 *Fee: ₦${lastFee.toLocaleString()}*\n\nCalculated via ClearCode System\nclearcodesystem.onrender.com`;
 let url=`https://wa.me/?text=${encodeURIComponent(msg)}`;
 window.open(url,'_blank');
}

function clearMap(){
 if(fromMarker) map.removeLayer(fromMarker);
 if(toMarker) map.removeLayer(toMarker);
 if(line) map.removeLayer(line);
 fromMarker=toMarker=line=fromLatLng=toLatLng=null; step=0;
 document.getElementById('res').style.display='none';
 document.getElementById('waBtn').style.display='none';
 document.getElementById('dist').innerText='';
}

if(navigator.geolocation){
 navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],14);});
}
</script>
</body>
</html>
