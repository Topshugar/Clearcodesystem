<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب المعدل الجامعي 2026 - GPA Calculator Gulf 5.0 & 4.0 | ClearCodeSystem</title>
<meta name="description" content="حساب المعدل الجامعي - نظام 5.0 السعودية و 4.0 قطر الامارات - GPA to percentage ممتاز جيد جدا">
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#080808;color:#fff;font-family:Inter,Tajawal,sans-serif;padding:16px}
.card{max-width:600px;margin:20px auto;background:#121212;border:1px solid #222;border-radius:20px;padding:18px}
input,select{width:100%;padding:14px;background:#080808;border:1px solid #333;border-radius:12px;color:#fff;margin-top:10px;font-size:15px}
button{width:100%;padding:14px;background:#00FF88;color:#000;border:none;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}
button.sec{background:#222;color:#fff;border:1px solid #333}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
.result{margin-top:16px;background:#0a0a0a;border:1px solid #00FF88;border-radius:14px;padding:16px;display:none;text-align:center}
.ad-slot{margin:14px 0;min-height:90px;background:#0e0e0e;border-radius:12px;display:flex;align-items:center;justify-content:center}
.badge{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:900;display:inline-block}
.subject-row{display:flex;gap:8px;margin-top:8px}
.subject-row input{flex:1}
</style>
</head>
<body>
<div class="card">
<h2 style="font-weight:900">🎓 حساب المعدل - Gulf Edition</h2>
<p style="font-size:11px;color:#888">السعودية نظام 5.0 - قطر الامارات 4.0 - مع مرتبة الشرف</p>

<div class="ad-slot"></div>

<select id="system" onchange="renderSubjects()">
<option value="5">🇸🇦 نظام 5.0 - السعودية (الملك سعود، عبدالعزيز)</option>
<option value="4">🇶🇦🇦🇪 نظام 4.0 - قطر، الامارات، الكويت، البحرين، عمان</option>
<option value="100">نسبة % - Percentage مباشر</option>
</select>

<select id="mode" onchange="renderSubjects()">
<option value="quick">⚡ سريع - Quick GPA to %</option>
<option value="semester">📚 فصل دراسي - Semester Calculator</option>
</select>

<div id="quickBox">
<input id="gpaQuick" type="number" step="0.01" placeholder="معدلك - مثال 4.25 / 3.75" oninput="calcQuick()">
</div>

<div id="semBox" style="display:none">
<select id="subCount" onchange="renderSubjects()">
<option value="5">5 مواد</option>
<option value="6">6 مواد</option>
<option value="7">7 مواد</option>
<option value="8">8 مواد</option>
</select>
<div id="subjects"></div>
</div>

<button onclick="calculate()">✨ احسب - Calculate</button>

<div id="res" class="result"></div>

<div class="ad-slot" id="mid" style="display:none"></div>

<div style="margin-top:12px;background:#0a0a0a;border-radius:12px;padding:12px">
<p style="font-size:10px;color:#666;line-height:1.6">تقديرات الجامعات الخليجية:<br>• 4.50-5.00 / 3.50-4.00 = ممتاز + مرتبة شرف أولى 🌟<br>• 4.00-4.49 / 3.00-3.49 = ممتاز<br>• 3.00-3.99 / 2.50-2.99 = جيد جدا<br>• 2.00-2.99 / 1.50-2.49 = جيد</p>
</div>

<a href="/" style="display:block;text-align:center;margin-top:12px;color:#555;font-size:11px;text-decoration:none">← Back</a>
<div class="ad-slot"></div>
</div>

<script>
function renderSubjects(){
 const mode=document.getElementById('mode').value;
 document.getElementById('quickBox').style.display=mode==='quick'?'block':'none';
 document.getElementById('semBox').style.display=mode==='semester'?'block':'none';
 if(mode==='semester'){
  const count=parseInt(document.getElementById('subCount').value);
  const sys=document.getElementById('system').value;
  const max=sys==='5'?'5':'4';
  let html='';
  for(let i=1;i<=count;i++){
   html+=`<div class="subject-row"><input type="text" placeholder="مادة ${i} - المادة"><input type="number" step="0.01" max="${max}" class="gpaSub" placeholder="GPA ${max}"><input type="number" class="creditSub" placeholder="ساعات" value="3" style="max-width:70px"></div>`;
  }
  document.getElementById('subjects').innerHTML=html;
 }
}

function calcQuick(){
 if(document.getElementById('mode').value!=='quick') return;
 calculate();
}

function calculate(){
 const sys=document.getElementById('system').value;
 const mode=document.getElementById('mode').value;
 let perc=0, gpaVal=0;

 if(mode==='quick'){
  gpaVal=parseFloat(document.getElementById('gpaQuick').value);
  if(isNaN(gpaVal)) return;
  if(sys==='5') perc=(gpaVal/5)*100;
  else if(sys==='4') perc=(gpaVal/4)*100;
  else perc=gpaVal;
 } else {
  const gpas=document.querySelectorAll('.gpaSub');
  const credits=document.querySelectorAll('.creditSub');
  let totalPoints=0, totalCredits=0;
  gpas.forEach((g,i)=>{
   const gv=parseFloat(g.value)||0;
   const cr=parseFloat(credits[i].value)||0;
   totalPoints+=gv*cr;
   totalCredits+=cr;
  });
  if(totalCredits===0) return;
  gpaVal=totalPoints/totalCredits;
  if(sys==='5') perc=(gpaVal/5)*100;
  else perc=(gpaVal/4)*100;
 }

 let taqdeer='', color='#00FF88';
 if(perc>=90){taqdeer='ممتاز مع مرتبة الشرف الأولى 🌟'; color='#00FF88';}
 else if(perc>=85){taqdeer='ممتاز - Excellent'; color='#00FF88';}
 else if(perc>=75){taqdeer='جيد جداً - Very Good'; color='#00d4ff';}
 else if(perc>=65){taqdeer='جيد - Good'; color='#ffaa00';}
 else if(perc>=50){taqdeer='مقبول - Pass'; color='#ffaa00';}
 else {taqdeer='راسب - Fail'; color='#ff4444';}

 const gpa4 = sys==='5' ? (gpaVal/5)*4 : (sys==='4'?gpaVal:(perc/100)*4);
 const gpa5 = sys==='4' ? (gpaVal/4)*5 : (sys==='5'?gpaVal:(perc/100)*5);

 document.getElementById('res').style.display='block';
 document.getElementById('res').style.borderColor=color;
 document.getElementById('res').innerHTML=`
 <span class="badge" style="background:${color};color:#000">${taqdeer}</span>
 <b style="font-size:38px;display:block;margin-top:8px;color:${color}">${perc.toFixed(2)}%</b>
 <p style="font-size:12px;color:#888;margin-top:4px">GPA: ${gpaVal.toFixed(2)} / ${sys==='100'?'100':sys}</p>
 <div style="margin-top:12px;text-align:right">
 <div class="row"><span>من 4.0 (قطر/الامارات)</span><b>${gpa4.toFixed(2)}</b></div>
 <div class="row"><span>من 5.0 (السعودية)</span><b>${gpa5.toFixed(2)}</b></div>
 <div class="row"><span>النسبة %</span><b>${perc.toFixed(2)}%</b></div>
 </div>
 `;
 document.getElementById('mid').style.display='flex';
}

renderSubjects();
</script>
<script>(function(s){s.dataset.zone='11988352',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
