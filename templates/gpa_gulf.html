<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="حساب المعدل الجامعي GPA to percentage - السعودية قطر الامارات - 4.0 و 5.0">

<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#080808;color:#fff;font-family:Inter,Tajawal,sans-serif;padding:16px}
.card{max-width:550px;margin:20px auto;background:#121212;border:1px solid #222;border-radius:20px;padding:18px}
input,select{width:100%;padding:14px;background:#080808;border:1px solid #333;border-radius:12px;color:#fff;margin-top:10px;font-size:15px}
button{width:100%;padding:14px;background:#00FF88;color:#000;border:none;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}
.result{margin-top:16px;background:#0a0a0a;border:1px solid #00FF88;border-radius:14px;padding:16px;display:none;text-align:center}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
.ad-slot{margin:14px 0;min-height:90px;background:#0e0e0e;border-radius:12px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="card">
<h2 style="font-weight:900">🎓 حساب المعدل - GPA Calculator</h2>
<p style="font-size:11px;color:#888">لطلاب السعودية، قطر، الامارات - حول GPA لـ % بسرعة</p>

<div class="ad-slot"></div>

<select id="system">
<option value="5">نظام 5.0 - السعودية (جامعة الملك سعود)</option>
<option value="4">نظام 4.0 - قطر، الامارات، الكويت</option>
<option value="100">نسبة مئوية 100% - Percentage</option>
</select>

<input id="gpa" type="number" step="0.01" placeholder="معدلك - مثال: 3.75" oninput="calc()">

<select id="gradeCount">
<option value="1">مادة واحدة - Quick</option>
<option value="5">5 مواد - Semester</option>
<option value="8">8 مواد - Full</option>
</select>

<div id="subjects"></div>

<button onclick="calc()">✨ احسب - Calculate</button>

<div id="res" class="result"></div>

<div class="ad-slot" id="mid" style="display:none"></div>

<a href="/" style="display:block;text-align:center;margin-top:12px;color:#555;font-size:11px;text-decoration:none">← Back</a>
<div class="ad-slot"></div>
</div>

<script>
function calc(){
 const sys=parseFloat(document.getElementById('system').value);
 const gpa=parseFloat(document.getElementById('gpa').value);
 if(isNaN(gpa)) return;
 let perc, تقدير;
 if(sys===5){perc=(gpa/5)*100}
 else if(sys===4){perc=(gpa/4)*100}
 else {perc=gpa; if(gpa>5) perc=gpa; }

 if(perc>=90) تقدير='ممتاز - Excellent 🌟';
 else if(perc>=80) تقدير='جيد جداً - Very Good';
 else if(perc>=65) تقدير='جيد - Good';
 else if(perc>=50) تقدير='مقبول - Pass';
 else تقدير='راسب - Fail 😔';

 const gpa4= sys===5 ? (gpa/5)*4 : (sys===4?gpa:(perc/100)*4);
 const gpa5= sys===4 ? (gpa/4)*5 : (sys===5?gpa:(perc/100)*5);

 document.getElementById('res').style.display='block';
 document.getElementById('res').innerHTML=`
 <p style="font-size:12px;color:#888">النتيجة:</p>
 <b style="font-size:36px;color:#00FF88">${perc.toFixed(2)}%</b>
 <p style="font-size:14px;margin-top:6px">${تقدير}</p>
 <div style="margin-top:12px;text-align:right">
 <div class="row"><span>GPA 4.0</span><b>${gpa4.toFixed(2)}</b></div>
 <div class="row"><span>GPA 5.0</span><b>${gpa5.toFixed(2)}</b></div>
 <div class="row"><span>من 100</span><b>${perc.toFixed(2)}%</b></div>
 </div>
 `;
 document.getElementById('mid').style.display='flex';
}
</script>
<script>(function(s){s.dataset.zone='11988352',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
