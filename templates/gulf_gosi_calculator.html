</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>💼 GOSI Calculator 2026</h2><select id="type"><option value="saudi_before">Saudi Before July 2024 - 11.75/9.75</option><option value="saudi_after">Saudi After July 2024 - 12.75/10.75</option><option value="expat">Expat 2%</option></select><input id="basic" type="number" placeholder="Basic+Housing SAR max 45000"><button class="btn" onclick="calc()">Calculate</button><div id="out"></div></div><script>function calc(){let sal=Math.min(45000,parseFloat(document.getElementById('basic').value)||0);let t=document.getElementById('type').value;let er=0,ee=0;if(t=='saudi_before'){er=sal*0.1175;ee=sal*0.0975}if(t=='saudi_after'){er=sal*0.1275;ee=sal*0.1075}if(t=='expat'){er=sal*0.02;}document.getElementById('out').innerHTML=`<div class=res>Employer: SAR ${er.toFixed(2)}<br>Employee: SAR ${ee.toFixed(2)}<br><b style=color:#00FF88>Total: SAR ${(er+ee).toFixed(2)}</b></div>`;}</script></body></html>
