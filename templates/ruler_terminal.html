.cta{margin:10px;background:#00FF88;border-radius:10px;padding:4px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}

.cursor{display:inline-block;width:8px;height:15px;background:#00FF88;animation:blink 1s infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,50%{opacity:1} 70%,100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)}}
.shake{animation:shake 0.2s}

<script>
const term = document.getElementById('term');
const input = document.getElementById('cmd');
let history = [];
let hIndex = -1;

const localCmds = {
 help: `Available commands:

  clear - clear screen
  ls - list files
  pwd - current directory
  date - current date
  whoami - who you are
  echo [text] - print text

 ls: 'builder.html wa_qr.html invoice.html bg_remover.html fake_alert.html pos_charges.html delivery_fee.html price_tag.html profit_calculator.html debt_book.html clear_shell.html ruler_terminal.html',

 whoami: 'clearcode-vendor [level: RULER]',
 date: new Date().toString(),
 banner: `

██╔════╝██║ ██╔════╝██╔══██╗██╔══██╗██╔════╝██╔═══██╗██╔══██╗██╔════╝

██║ ██║ ██╔══╝ ██╔══██║██╔══██╗██║ ██║ ██║██║ ██║██╔══╝
╚██████╗███████╗███████╗██║ ██║██║ ██║╚██████╗╚██████╔╝██████╔╝███████╗
 ╚═════╝╚══════╝╚══════╝╚═╝ ╚═╝╚═╝ ╚═╝ ╚═════╝ ╚═════╝ ╚═════╝ ╚══════╝
        Vendor OS - Built for Naija Vendors`,
 vendors: '234 vendors online | Lagos: 89 | Abuja: 45 | PH: 31 | Others: 69',
 neofetch: `clearcode@vendor-os

OS: ClearCode Vendor OS 2.0
Host: Infinix HOT 40 Pro
Kernel: Android 14
Uptime: 12 days
Packages: 12 tools
Shell: ruler-terminal
CPU: 8-core (4x2.2GHz)
Memory: 256MB / 8GB
IP: 102.89.xxx.xxx [NG]`
};

function addLine(text, color='#00FF88'){
  const div = document.createElement('div');
  div.className='line';
  div.style.color=color;
  div.textContent=text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

async function runCmd(){
  let cmd = input.value.trim();
  if(!cmd) return;
  history.push(cmd); hIndex = history.length;
  addLine(`$ ${cmd}`,'#666');
  input.value='';

  let lower = cmd.toLowerCase();

  if(lower==='clear'){
    term.innerHTML = "<span style='color:#00FF88'>ClearCode Ruler v2.0 - Type 'help'...</span>";
    return;
  }
  if(lower==='hack'){
    hackAnim(); return;
  }
  if(lower==='matrix'){
    matrixAnim(); return;
  }
  if(localCmds[lower] || lower.startsWith('echo ')){
    if(lower.startsWith('echo ')){
      addLine(cmd.substring(5));
    } else {
      addLine(localCmds[lower]);
    }
    return;
  }
  // fallback to server api
  try{
    let res = await fetch('/api/ruler-terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
    let data = await res.json();
    if(data.output==='__CLEAR__'){
      term.innerHTML = "<span style='color:#00FF88'>ClearCode Ruler v2.0 - Type 'help'...</span>";
    } else {
      addLine(data.output);
    }
  }catch(e){
    term.classList.add('shake');
    addLine(`Command not found: ${cmd} - type 'help'`,'#ff4444');
    setTimeout(()=>term.classList.remove('shake'),200);
  }
}

function hackAnim(){
  let count=0;
  let iv=setInterval(()=>{
    addLine(`[${Math.random().toString(16).slice(2,8)}] Brute forcing vendor dashboard... ${Math.floor(Math.random()*100)}%`,'#00FF88');
    count++;
    if(count>18){clearInterval(iv); addLine('ACCESS GRANTED - Welcome Ruler_',' #00FF88');}
  },120);
}

function matrixAnim(){
  let chars="01";
  let count=0;
  let iv=setInterval(()=>{
    let line='';
    for(let i=0;i<60;i++) line+=chars[Math.floor(Math.random()*2)];
    addLine(line,'#00FF8844');
    count++;
    if(count>15){clearInterval(iv); addLine('Matrix mode off - type clear',' #888');}
  },80);
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter') runCmd();
  if(e.key==='ArrowUp'){ if(hIndex>0){hIndex--; input.value=history[hIndex];} }
  if(e.key==='ArrowDown'){ if(hIndex<history.length-1){hIndex++; input.value=history[hIndex];} else {hIndex=history.length; input.value='';} }
});
</script>
