<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BG + Leonardo Prompt + 4K</title>
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script>(function(s){s.dataset.zone='11988352',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif}.header{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.header a{color:#00FF88;text-decoration:none;font-weight:800;font-size:13px}.wrap{max-width:900px;margin:auto;padding:12px}.upload{border:2px dashed #333;border-radius:20px;padding:32px;text-align:center;background:#111;cursor:pointer}.upload input{display:none}.compare{position:relative;width:100%;aspect-ratio:1/1.2;background:#000;border-radius:16px;overflow:hidden;display:none;border:1px solid #222;margin-top:12px}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#after{clip-path:inset(0 50% 0 0)}.slider{position:absolute;top:0;left:50%;width:3px;height:100%;background:#00FF88;transform:translateX(-50%)}.handle{position:absolute;top:50%;left:50%;width:40px;height:40px;background:#00FF88;color:#000;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:900}.card{background:#151515;border:1px solid #222;border-radius:20px;padding:16px;margin-top:14px}.leonardo{background:#111;border:1px solid #a855f7;border-radius:20px;padding:16px;margin-top:14px}.leonardo input{width:100%;padding:14px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;margin-top:8px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:8px 14px;background:#000;border:1px solid #333;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}.btn{width:100%;padding:14px;border:0;border-radius:14px;font-weight:900;cursor:pointer;margin-top:10px}.btn-purple{background:linear-gradient(90deg,#a855f7,#00FF88);color:#000}.btn-green{background:#00FF88;color:#000}.btn-dark{background:#222;color:#fff;border:1px solid #333}.result-bg{width:100%;border-radius:16px;margin-top:12px;display:none}.loading{display:none;text-align:center;padding:20px;color:#00FF88;font-weight:800}</style></head><body>
<div class="header"><a href="/">← Back</a><b>AI BG • LEONARDO • 4K</b><span style="font-size:8px;background:linear-gradient(90deg,#00FF88,#a855f7);color:#000;padding:5px 10px;border-radius:20px;font-weight:900">MONETAG BOTH ACTIVE</span></div>
<div class="wrap">
<label class="upload" id="upBox"><input type="file" id="file" accept="image/*"><div style="font-size:36px">🤖</div><b>Upload Photo</b><p style="font-size:11px;color:#666">Human model auto</p></label>
<div class="loading" id="load">⏳ Removing BG...</div>
<div class="compare" id="compare"><img id="before"><img id="after"><div class="slider" id="slider"><div class="handle">↔️</div></div></div>
<div class="card" id="resultCard" style="display:none"><h3 style="color:#00FF88;font-size:12px">STEP 1 DONE • DRAG ↔️</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn btn-dark" onclick="downloadCut()">⬇️ Transparent</button><button class="btn btn-dark" onclick="share()">📱 Share</button></div></div>
<div class="leonardo" id="leoBox" style="display:none"><h3 style="color:#a855f7;font-size:12px">STEP 2 • LEONARDO PROMPT</h3><input id="prompt" placeholder="e.g: luxury black studio with neon rim light, 4K"><div class="chips">
<span class="chip" onclick="setP('white studio background, soft light, 4K')">🤍 White</span>
<span class="chip" onclick="setP('luxury boutique shelf, dark moody light, 4K')">🖤 Luxury Dark</span>
<span class="chip" onclick="setP('cyberpunk neon city, night, 4K')">🌃 Neon</span>
<span class="chip" onclick="setP('beach sunset, golden hour, 4K')">🌅 Beach</span>
</div><button class="btn btn-purple" onclick="generateBg()">✨ Generate Background</button><div class="loading" id="loadBg">⏳ Generating...</div><img id="finalResult" class="result-bg"><button class="btn btn-green" id="finalBtn" style="display:none" onclick="downloadFinal()">🔥 Download Final 4K</button></div>
</div>
<script>
let cutB64='',promptEl=document.getElementById('prompt');
function setP(t){promptEl.value=t}
document.getElementById('file').addEventListener('change',async e=>{
 let file=e.target.files[0]; if(!file) return;
 document.getElementById('upBox').style.display='none';document.getElementById('load').style.display='block';
 let fd=new FormData();fd.append('image',file);fd.append('mode','human');
 try{let res=await fetch('/api/bg-remove',{method:'POST',body:fd});let data=await res.json();if(data.error) throw data.error;
 cutB64=data.result;document.getElementById('before').src=URL.createObjectURL(file);document.getElementById('after').src=data.result;
 document.getElementById('compare').style.display='block';document.getElementById('resultCard').style.display='block';document.getElementById('leoBox').style.display='block';document.getElementById('load').style.display='none';initSlider();
 }catch(err){document.getElementById('load').innerHTML='❌ '+err;}
});
function initSlider(){let wrap=document.getElementById('compare'),after=document.getElementById('after'),slider=document.getElementById('slider');let drag=false;function move(e){let r=wrap.getBoundingClientRect();let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;let pct=Math.max(5,Math.min(95,(x/r.width)*100));after.style.clipPath=`inset(0 ${100-pct}% 0 0)`;slider.style.left=pct+'%';}slider.addEventListener('mousedown',()=>drag=true);window.addEventListener('mouseup',()=>drag=false);window.addEventListener('mousemove',e=>{if(drag)move(e)});slider.addEventListener('touchstart',()=>drag=true);window.addEventListener('touchend',()=>drag=false);window.addEventListener('touchmove',e=>{if(drag)move(e)});wrap.addEventListener('click',move);}
async function generateBg(){let prompt=promptEl.value.trim();if(!prompt) return alert('Type prompt');if(!cutB64) return alert('Remove BG first');document.getElementById('loadBg').style.display='block';let encoded=encodeURIComponent(prompt+', 4K, ultra detailed, professional background, no person');let bgUrl=`https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1280&nologo=true&model=flux&seed=${Math.floor(Math.random()*9999)}`;let bgImg=new Image();bgImg.crossOrigin='anonymous';bgImg.onload=()=>{let cutImg=new Image();cutImg.onload=()=>{let canvas=document.createElement('canvas');canvas.width=1024;canvas.height=1280;let ctx=canvas.getContext('2d');ctx.drawImage(bgImg,0,0,canvas.width,canvas.height);let scale=Math.min(canvas.width/cutImg.width,canvas.height/cutImg.height)*0.85;let w=cutImg.width*scale,h=cutImg.height*scale;ctx.drawImage(cutImg,(canvas.width-w)/2,(canvas.height-h)/2,w,h);let final=canvas.toDataURL('image/png');document.getElementById('finalResult').src=final;document.getElementById('finalResult').style.display='block';document.getElementById('finalBtn').style.display='block';document.getElementById('loadBg').style.display='none';document.getElementById('finalResult').dataset.final=final;};cutImg.src=cutB64;};bgImg.onerror=()=>{document.getElementById('loadBg').innerHTML='❌ failed';};bgImg.src=bgUrl;}
function downloadCut(){let a=document.createElement('a');a.href=cutB64;a.download='cut-transparent.png';a.click();}
function downloadFinal(){let final=document.getElementById('finalResult').dataset.final;let a=document.createElement('a');a.href=final;a.download='leonardo-4k.png';a.click();}
function share(){window.open('https://wa.me/?text=ClearCode '+location.href);}
</script></body></html>
