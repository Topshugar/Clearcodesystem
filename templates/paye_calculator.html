</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>💼 PAYE Nigeria 2026</h2>
<input id="gross" type="number" placeholder="Monthly Gross ₦ e.g. 300000">
<button class="btn" onclick="calc()">Calculate PAYE + Pension</button><div id="out"></div>
<p style="font-size:10px;color:#555;margin-top:8px">Pension 8% + CRA + Tax brackets 7%-24% simplified</p>
</div><script>function calc(){let gross=parseFloat(document.getElementById('gross').value)||0;let pension=gross*0.08;let taxable=gross-pension;let tax=0;if(taxable>0){let t=taxable*12;let annualTax=0;if(t<=300000) annualTax=t*0.07; else if(t<=600000) annualTax=21000+(t-300000)*0.11; else if(t<=1100000) annualTax=54000+(t-600000)*0.15; else if(t<=1600000) annualTax=129000+(t-1100000)*0.19; else if(t<=3200000) annualTax=224000+(t-1600000)*0.21; else annualTax=560000+(t-3200000)*0.24; tax=annualTax/12;}let net=gross-pension-tax;document.getElementById('out').innerHTML=`<div class=res>Pension 8%: ₦${pension.toLocaleString()}<br>PAYE Tax: ₦${tax.toFixed(0).toLocaleString()}<br><b style=color:#00FF88>Net: ₦${net.toFixed(0).toLocaleString()}</b><br><span style=color:#888;font-size:11px>Gross ₦${gross.toLocaleString()}</span></div>`;}</script></body></html>
