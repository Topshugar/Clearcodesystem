<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px} .card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px} input{width:100%;padding:12px;border-radius:10px;background:#080808;border:1px solid #333;color:#fff;margin-top:8px;letter-spacing:2px} .btn{width:100%;padding:14px;background:#00FF88;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:12px} .slip{margin-top:12px;background:#fff;color:#000;border-radius:12px;padding:16px;font-family:monospace} .res{margin-top:12px;background:#080808;border:1px solid #00FF88;border-radius:12px;padding:12px}</style>
</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>🪪 NIN Checker + Slip</h2>
<input id="nin" maxlength="11" placeholder="Enter 11-digit NIN">
<button class="btn" onclick="calc()">Validate + Generate Slip</button><div id="out"></div>
<p style="font-size:9px;color:#555;margin-top:8px">Note: Format validator only, not connected to NIMC database. For reference slip printing only.</p>
</div><script>function calc(){let nin=document.getElementById('nin').value.trim();let valid=/^[0-9]{11}$/.test(nin);document.getElementById('out').innerHTML=`<div class=res>Format: <b style=color:${valid?'#00FF88':'#ff4444'}>${valid?'Valid 11 digits ✅':'Invalid - Must be 11 digits ❌'}</b></div>${valid?`<div class=slip><div style=text-align:center;font-weight:900>NIMC - NIN SLIP (REFERENCE)</div><hr>NIN: <b>${nin}</b><br>Name: ___________________<br>DOB: ___/___/____<br><br><div style=text-align:center;font-size:10px>For verification visit nimc.gov.ng<br>Generated by ClearCodeSystem - ${new Date().toLocaleDateString()}</div></div><button class=btn onclick=window.print()>Print Slip</button>`:''}`;}</script></body></html>
