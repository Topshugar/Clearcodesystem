<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clan Logo Maker - Esports Logo for FF & COD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>body{margin:0;background:#080808;color:#fff;font-family:Inter,sans-serif}.header{padding:14px;background:#111;display:flex;justify-content:space-between;border-bottom:1px solid #222}.wrap{max-width:600px;margin:auto;padding:16px}input,select{width:100%;padding:13px;background:#111;border:1px solid #333;color:#fff;border-radius:12px;margin-top:8px}label{font-size:11px;color:#888;margin-top:12px;display:block}#logo{width:260px;height:260px;background:#111;border:2px solid #FFD700;border-radius:20px;margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.btn{width:100%;padding:14px;background:#FFD700;color:#000;border:0;font-weight:900;border-radius:12px;margin-top:10px}</style>
</head>
<body>
<div class="header"><a href="/" style="color:#888;text-decoration:none">← Back</a><span style="color:#FFD700;font-weight:800">CLAN LOGO</span><div style="width:40px"></div></div>
<div class="wrap">
<label>Clan Name</label>
<input id="clan" value="RULER ESPORTS" oninput="draw()">
<label>Icon / Emoji</label>
<select id="icon" onchange="draw()">
<option>🛡️</option><option>⚔️</option><option>🔥</option><option>👑</option><option>🐺</option><option>🦁</option><option>💀</option><option>⚡</option>
</select>
<div id="logo"><div id="ico" style="font-size:80px">🛡️</div><div id="txt" style="font-weight:900;font-size:20px;margin-top:10px">RULER ESPORTS</div></div>
<button class="btn" onclick="download()">DOWNLOAD PNG LOGO</button>
</div>
<script>
function draw(){
 document.getElementById('txt').innerText=document.getElementById('clan').value;
 document.getElementById('ico').innerText=document.getElementById('icon').value;
}
function download(){
 html2canvas(document.getElementById('logo')).then(c=>{
  let a=document.createElement('a');
  a.download='clan-logo.png';
  a.href=c.toDataURL();
  a.click();
 });
}
draw();
</script>
</body>
</html>
