{% extends "base.html" %}
{% block content %}
<div class="grid">
{% for tool in tools %}
<a href="{{ tool.url }}">
<div class="card">
<div class="icon">🔧</div>
<div class="title">{{ tool.name }}</div>
<div class="live">● LIVE • {{ tool.country if tool.country != 'ALL' else user_country }}</div>
</div>
</a>
{% endfor %}
</div>
{% endblock %}
