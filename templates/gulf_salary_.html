<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px} .card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px} input{width:100%;padding:12px;border-radius:10px;background:#080808;border:1px solid #333;color:#fff;margin-top:8px} .btn{width:100%;padding:14px;background:#00FF88;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:12px} .res{margin-top:12px;background:#080808;border:1px solid #00FF88;border-radius:12px;padding:12px}</style>
</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>💰 Saudi Net Salary Calculator</h2><input id="basic" type="number" placeholder="Basic Salary SAR"><input id="housing" type="number" placeholder="Housing Allowance SAR"><input id="other" type="number" placeholder="Other Allowances SAR"><button class="btn" onclick="calc()">Calculate Net with GOSI</button><div id="out"></div></div><script>function calc(){let basic=parseFloat(document.getElementById('basic').value)||0;let house=parseFloat(document.getElementById('housing').value)||0;let other=parseFloat(document.getElementById('other').value)||0;let gosiBase=Math.min(45000,basic+house);let gosi=gosiBase*0.0975;let net=basic+house+other-gosi;document.getElementById('out').innerHTML=`<div class=res>GOSI 9.75%: SAR ${gosi.toFixed(2)}<br><b style=color:#00FF88>Net Salary: SAR ${net.toFixed(2)}</b><br><span style=color:#888;font-size:11px>Gross: SAR ${(basic+house+other).toFixed(2)}</span></div>`;}</script></body></html>
