<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearCodeSystem</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;margin:0}
a{color:#00ff88;text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{background:#1a1a1a;padding:14px;border-radius:10px;border:1px solid #333}
.top{color:#00ff88;font-weight:bold}
</style>
</head>
<body>
<div class="top">ClearCodeSystem - {{ user_country }} - {{ tools|length }} tools</div>
<div class="grid">
{% for t in tools %}
<a href="{{ t.url }}"><div class="card">{{ t.name }}</div></a>
{% endfor %}
</div>
{% if tools|length == 0 %}
<p style="margin-top:40px;color:#888">No tools found for {{ user_country }}. Check app.py lists.</p>
{% endif %}
</body>
</html>
