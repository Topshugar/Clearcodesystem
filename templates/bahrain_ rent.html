<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahrain Rent Calculator Manama BHD - Split + Commission + Deposit</title>
<meta name="description" content="Bahrain rent splitter calculator BHD - split rent, commission, municipality, EWA deposit Manama Bahrain 2026">
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px}.card{max-width:500px;margin:30px auto;background:#121212;border:1px solid #222;border-radius:18px;padding:20px}label{font-size:10px;color:#888;display:block;margin:10px 0 4px}input{width:100%;padding:12px;background:#080808;border:1px solid #222;color:#fff;border-radius:10px}.btn{width:100%;background:#00FF88;color:#000;padding:12px;border-radius:12px;font-weight:900;border:0;margin-top:14px;cursor:pointer}#res{margin-top:14px;background:#0a0a0a;border:1px solid #00FF88;border-radius:12px;padding:14px;display:none}</style>
</head>
<body>
<div class="card">
<h2>🇧🇭 Bahrain Rent Calculator</h2><p style="font-size:11px;color:#888">Manama + Muharraq - BHD split</p>
<label>Monthly Rent BHD</label><input id="rent" type="number" placeholder="e.g. 250">
<label>Number of Roommates</label><input id="people" type="number" value="2">
<label>Commission % (usually half month)</label><input id="comm" type="number" value="50">
<button class="btn" onclick="calc()">CALCULATE BHD →</button>
<div id="res"></div>
<a href="/" style="display:block;margin-top:12px;color:#888;font-size:11px;text-decoration:none">← Home</a>
</div>
<script>
function calc(){
let rent=parseFloat(document.getElementById('rent').value)||0;
let p=parseFloat(document.getElementById('people').value)||1;
let comm=parseFloat(document.getElementById('comm').value)||0;
let totalComm = rent * comm/100;
let perPerson = rent / p;
let firstMonth = rent + totalComm;
let r=document.getElementById('res');
r.style.display='block';
r.innerHTML=`<b style="color:#00FF88">Per Person: BHD ${perPerson.toFixed(3)} / month</b><br><span style="font-size:12px">Total first month with commission: BHD ${firstMonth.toFixed(3)}<br>Commission: BHD ${totalComm.toFixed(3)} (${comm}%)<br>EWA Deposit: ~BHD 30-50 extra</span>`;
}
</script>
</body>
</html>
