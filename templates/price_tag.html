<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="monetag" content="7c196691a3e21ac5aec6567991b655c2">
<title>Price Tag AI - ClearCode</title>
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
body{margin:0;background:#060606;color:#fff;font-family:Arial;padding:15px}
.card{background:#111;border:1px solid #1d1d1d;border-radius:16px;padding:18px}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #222;background:#0a0a0a;color:#fff;box-sizing:border-box}
button{width:100%;padding:16px;background:#00ff88;color:#000;border:0;border-radius:12px;font-weight:bold;margin-top:10px}
canvas{width:100%;border-radius:16px;margin-top:15px;background:#fff}
</style>
</head>
<body>
<a href="/" style="color:#00ff88;text-decoration:none">← Back</a>
<h2>Price Tag AI 🏷️</h2>
<div class="card">
<input id="pname" placeholder="Product e.g. White Puma Shoe">
<input id="price" placeholder="Price e.g. ₦15,000">
<input id="biz" placeholder="Business Name e.g. Clear code" value="Clear code">
<input id="phone" placeholder="WhatsApp" value="08165043865">
<select id="color"><option value="#00ff88">Green Theme</option><option value="#ffcc00">Yellow</option><option value="#ff3b3b">Red</option><option value="#00d9ff">Blue</option></select>
<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="useAI" checked style="width:auto"> Use AI Image</label>
<button onclick="make()">Generate Flyer</button>
<button onclick="download()" style="background:#fff">Download Image</button>
<small id="status" style="color:#00ff88;display:block;margin-top:8px"></small>
</div>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
let aiImg = new Image();
let aiLoaded=false;
function draw(biz,name,price,phone,color){
 let cv=document.getElementById('c'), ctx=cv.getContext('2d');
 ctx.fillStyle='#fff'; ctx.fillRect(0,0,1080,1080);
 ctx.fillStyle=color; ctx.fillRect(0,0,1080,200);
 ctx.fillStyle='#000'; ctx.font='bold 60px Arial'; ctx.textAlign='center';
 ctx.fillText(biz.toUpperCase(),540,130);
 if(aiLoaded){
   try{ ctx.drawImage(aiImg,340,220,400,400); }catch(e){}
   ctx.fillStyle='#000'; ctx.font='bold 55px Arial'; ctx.fillText(name,540,700);
 } else {
   ctx.fillStyle='#000'; ctx.font='bold 60px Arial'; ctx.fillText(name,540,500);
 }
 ctx.fillStyle=color; ctx.font='bold 100px Arial'; ctx.fillText(price,540,820);
 ctx.fillStyle='#333'; ctx.font='28px Arial'; ctx.fillText('WhatsApp: '+phone,540,920);
 ctx.fillText('Powered by ClearCode System',540,970);
}
async function make(){
 let name=document.getElementById('pname').value||'Product';
 let price=document.getElementById('price').value||'₦1000';
 let biz=document.getElementById('biz').value||'Clear code';
 let phone=document.getElementById('phone').value||'08165043865';
 let color=document.getElementById('color').value;
 let useAI=document.getElementById('useAI').checked;
 let st=document.getElementById('status');
 if(useAI && name){
   st.innerText='AI drawing '+name+'... (10 sec)';
   aiLoaded=false;
   try{
     let prompt = encodeURIComponent(name + ' product photo white background studio');
     let res = await fetch('/api/ai-image?prompt='+prompt);
     let data = await res.json();
     if(data.image){
       aiImg = new Image();
       aiImg.onload=()=>{ aiLoaded=true; st.innerText='AI success!'; draw(biz,name,price,phone,color); };
       aiImg.src=data.image;
     } else { st.innerText='AI failed, text only'; draw(biz,name,price,phone,color); }
   }catch(e){ st.innerText='AI error: '+e; draw(biz,name,price,phone,color); }
 } else { draw(biz,name,price,phone,color); }
}
function download(){
 let a=document.createElement('a'); a.download='price-tag.png'; a.href=document.getElementById('c').toDataURL(); a.click();
}
draw('CLEAR CODE','White puma shoe','1000','08165043865','#00ff88');
</script>
</body>
</html>
