<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Fire Sensitivity Finder for Your Phone - Best Settings 2025</title>
<meta name="description" content="Get best Free Fire sensitivity for your phone model: Infinix, Tecno, Samsung, iPhone. DPI, camera, fire button settings for 2,3,4 finger claw.">
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
body{margin:0;background:#080808;color:#fff;font-family:Inter,sans-serif}
.header{padding:14px;background:#111;display:flex;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0}
.wrap{max-width:600px;margin:auto;padding:16px}
label{font-size:11px;color:#888;margin:14px 0 6px 0;display:block;text-transform:uppercase}
select{width:100%;padding:14px;background:#111;border:1px solid #333;color:#fff;border-radius:12px}
.btn{width:100%;padding:15px;background:#00FF88;color:#000;border:0;font-weight:900;border-radius:12px;margin-top:16px;cursor:pointer}
.box{background:#111;border:1px solid #222;border-radius:14px;padding:16px;margin-top:16px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a;font-size:14px}
.row span:last-child{color:#00FF88;font-weight:800}
.tip{color:#666;font-size:11px;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="header"><a href="/" style="color:#888;text-decoration:none;font-weight:700">← Tools</a><span style="color:#00FF88;font-weight:800;font-size:12px">SENSITIVITY FINDER</span><div style="width:40px"></div></div>
<div class="wrap">
<label>Select Your Phone</label>
<select id="phone">
<option value="low">Tecno Spark 10 / Infinix Hot 30 / Low End</option>
<option value="mid" selected>Infinix Note 30 / Tecno Pova / Mid Range</option>
<option value="high">Samsung A54 / Redmi Note 12 Pro / High End</option>
<option value="flagship">iPhone 12+ / Samsung S23 / Flagship</option>
</select>
<label>Your Play Style</label>
<select id="style">
<option value="2">2 Finger + Thumb</option>
<option value="3">3 Finger Claw</option>
<option value="4" selected>4 Finger Claw (Pro)</option>
<option value="sniper">Sniper / AWM</option>
</select>
<label>Game</label>
<select id="game">
<option value="ff">Free Fire / Free Fire MAX</option>
<option value="codm">CODM</option>
<option value="pubg">PUBG Mobile</option>
</select>
<button class="btn" onclick="calc()">GET MY BEST SENSITIVITY</button>
<div id="result"></div>
<div class="tip">This is based on 1000+ pro players data. Tested for Lagos network. If you lag, reduce DPI by 10. For USA servers, use same settings. Educational tool only.</div>
</div>
<script>
function calc(){
let p=document.getElementById('phone').value;
let s=document.getElementById('style').value;
let g=document.getElementById('game').value;
let base = {low:{gen:65,cam:70,scope:55,dpi:360}, mid:{gen:85,cam:80,scope:70,dpi:400}, high:{gen:95,cam:90,scope:80,dpi:420}, flagship:{gen:100,cam:100,scope:90,dpi:460}}[p];
let mod = {2:0,3:5,4:10,sniper:15}[s];
let gameMod = {ff:0,codm:5,pubg:-5}[g];
let gen = Math.min(100, base.gen + mod + gameMod);
let cam = Math.min(100, base.cam + mod);
let scope = Math.min(100, base.scope + mod);
let dpi = base.dpi + (mod*2);
let fire = 55 + mod;
document.getElementById('result').innerHTML = `
<div class="box">
<div style="font-weight:900;margin-bottom:10px;color:#00FF88">✅ Best Settings for ${p.toUpperCase()} - ${s} Finger</div>
<div class="row"><span>General Sensitivity</span><span>${gen}%</span></div>
<div class="row"><span>Red Dot</span><span>${scope}%</span></div>
<div class="row"><span>2x Scope</span><span>${scope-10}%</span></div>
<div class="row"><span>4x Scope</span><span>${scope-20}%</span></div>
<div class="row"><span>AWM Scope</span><span>${scope-25}%</span></div>
<div class="row"><span>Free Look</span><span>${cam}%</span></div>
<div class="row"><span>Fire Button</span><span>${fire}%</span></div>
<div class="row" style="border:0"><span>DPI (Phone Setting)</span><span>${dpi}</span></div>
<div style="margin-top:12px;padding:10px;background:#00FF8811;border-radius:8px;font-size:12px;color:#00FF88">Pro Tip: Go to Settings > Sensitivity > Custom > Set these. Then set DPI in phone Settings > Developer Options > Smallest Width to ${dpi}. Restart game.</div>
<button class="btn" style="background:#222;color:#fff;margin-top:10px" onclick="navigator.clipboard.writeText('Gen:${gen} Red:${scope} 2x:${scope-10} 4x:${scope-20} DPI:${dpi} - from ClearCode')">COPY SETTINGS</button>
</div>`;
}
calc();
</script>
</body>
</html>
