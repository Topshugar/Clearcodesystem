<!DOCTYPE html>
<html><head><title>APK Builder - ClearCode System</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<nav><a href="/"><b>ClearCode System</b></a></nav>
<section class="builder">
<h1>URL to APK Builder</h1>
<p>Paste your website link, get APK source code.</p>
<form action="/generate" method="POST">
<input name="app_name" placeholder="App Name e.g. MyShop" required>
<input name="url" placeholder="https://yourwebsite.com" required>
<button type="submit">Generate APK Source (ZIP)</button>
</form>
</section>
</body></html>
