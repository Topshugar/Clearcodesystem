<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BG Remover</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px;margin:0}
.card{background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:16px;margin-top:14px}
input{width:100%;padding:12px;background:#0a0a0a;border:1px dashed #333;border-radius:10px;color:#888}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin-top:12px;cursor:pointer}
.btn-g{background:#00ff88;color:#000}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.preview img{width:100%;border-radius:12px;background:#111;min-height:200px;object-fit:contain}
.checker{background:repeating-conic-gradient(#333 0% 25%,#111 0% 50%) 0 0/20px 20px}
#log{color:#00ff88;font-size:12px;text-align:center;margin-top:10px}
</style></head><body>
<a href="/" style="color:#3b82f6;text-decoration:none">← System</a> <b>Tool 05 BG Remover</b>
<p style="color:#666;font-size:12px">For white background product photos. Makes white transparent.</p>

<div class="card">
<input type="file" id="file" accept="image/*">
<button class="btn btn-g" onclick="removeBG()">✨ Remove Background</button>
<div id="log"></div>
<div class="preview">
<div><small>ORIGINAL</small><img id="orig"></div>
<div><small>NO BG</small><img id="res" class="checker"></div>
</div>
<a id="dl" style="display:none" class="btn btn-g" style="background:#fff;text-align:center;text-decoration:none;color:#000;display:none">📥 Download PNG</a>
</div>

<script>
const fileInput=document.getElementById('file');
const origImg=document.getElementById('orig');
const resImg=document.getElementById('res');

fileInput.addEventListener('change',()=>{
 const f=fileInput.files[0]; if(!f) return;
 const reader=new FileReader();
 reader.onload=e=>{origImg.src=e.target.result}
 reader.readAsDataURL(f);
});

async function removeBG(){
 const file=fileInput.files[0];
 if(!file) return alert('Choose file first');
 document.getElementById('log').innerText='⏳ Removing...';
 const fd=new FormData(); fd.append('image',file);
 try{
  const r=await fetch('/api/remove-bg',{method:'POST',body:fd});
  const data=await r.json();
  if(data.error) throw data.error;
  resImg.src=data.result;
  const dl=document.getElementById('dl');
  dl.href=data.result; dl.download='no-bg.png'; dl.style.display='block';
  dl.textContent='📥 Download Transparent PNG';
  document.getElementById('log').innerText='✅ Done! White background removed.';
 }catch(e){
  document.getElementById('log').innerText='Error: '+e;
  alert(e);
 }
}
</script>
</body></html>
