<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearcode Tools</title>
<!-- MONETAG ZONE 10323198 -->
<script>(function(s){s.dataset.zone='10323198',s.src='https://groleegni.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<!-- MONETAG ZONE 10323166 -->
<script>(function(s){s.dataset.zone='10323166',s.src='https://groleegni.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
body{background:#0f0f0f;color:#fff;margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.header{padding:16px 12px 0 12px;font-size:13px;color:#888}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#1e1e1e;border-radius:16px;padding:18px 15px;border:1px solid #2a2a2a}
.card:active{transform:scale(0.97)}
.icon{width:48px;height:48px;background:#252525;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.title{font-weight:600;margin-top:12px;font-size:14px;line-height:1.3;word-break:break-word}
.live{color:#00ff88;font-size:11px;margin-top:8px;font-weight:700;letter-spacing:0.5px}
a{color:inherit;text-decoration:none}
.empty{padding:40px;text-align:center;color:#666}
</style>
</head>
<body>
<div class="header">LIVE • {{ user_country }} • {{ tools|length }} Tools</div>
<div class="grid">
{% for tool in tools %}
<a href="{{ tool.url }}">
<div class="card">
<div class="icon">🔧</div>
<div class="title">{{ tool.name }}</div>
<div class="live">● LIVE • {{ user_country }}</div>
</div>
</a>
{% endfor %}
</div>
{% if tools|length == 0 %}
<div class="empty">No tools for {{ user_country }}</div>
{% endif %}
</body>
</html>
