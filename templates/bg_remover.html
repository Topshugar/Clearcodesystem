<style>

<div class="top"><a href="/" style="color:#3b82f6;text-decoration:none">← System</a><span class="small">Tool 05: BG Remover 🔥</span></div>
<h3>Remove Background - Free</h3>
<p class="small">For product photos - white bg auto removed</p>
<input type="file" id="file" accept="image/*" style="width:100%;padding:12px;background:#0f0f0f;border:1px solid #222;border-radius:10px;color:#fff">
<button onclick="removeBG()">Remove Background</button>
<div class="card" id="res" style="display:none">
<img id="out">
<button onclick="download()" style="background:#fff">Download PNG</button>
</div>
<script>
async function removeBG(){
 let f=document.getElementById('file').files[0]; if(!f){alert('Pick image');return}
 let fd=new FormData(); fd.append('image',f);
 let btn=document.querySelector('button'); btn.textContent='Processing...';
 const r=await fetch('/api/remove-bg',{method:'POST',body:fd});
 const d=await r.json();
 btn.textContent='Remove Background';
 if(d.result){document.getElementById('out').src=d.result; document.getElementById('res').style.display='block';}
 else alert(d.error||'Error');
}
function download(){let a=document.createElement('a');a.href=document.getElementById('out').src;a.download='bg-removed.png';a.click();}
</script>
