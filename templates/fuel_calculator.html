<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px} .card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px} input,select{width:100%;padding:12px;border-radius:10px;background:#080808;border:1px solid #333;color:#fff;margin-top:8px} .btn{width:100%;padding:14px;background:#00FF88;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:12px} .res{margin-top:12px;background:#080808;border:1px solid #00FF88;border-radius:12px;padding:12px}</style>
</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>⛽ Fuel Cost Calculator NG</h2>
<input id="km" type="number" placeholder="Distance KM e.g. Lagos to Ibadan 130">
<input id="litrePer100" type="number" placeholder="Car consumption L/100km e.g. 8" value="8">
<input id="price" type="number" placeholder="Fuel Price ₦ e.g. 1000" value="1000">
<button class="btn" onclick="calc()">Calculate Fuel Cost</button><div id="out"></div>
</div><script>function calc(){let km=parseFloat(document.getElementById('km').value)||0;let cons=parseFloat(document.getElementById('litrePer100').value)||8;let price=parseFloat(document.getElementById('price').value)||1000;let litres=(km/100)*cons;let cost=litres*price;document.getElementById('out').innerHTML=`<div class=res>Litres: ${litres.toFixed(1)}L<br>Cost: <b style=color:#00FF88>₦${cost.toLocaleString()}</b><br><span style=color:#888;font-size:11px>${km}km × ${cons}L/100km × ₦${price}</span></div>`;}</script></body></html>
