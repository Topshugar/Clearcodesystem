</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>⚡ NEPA Units Calculator 2026</h2><p style="color:#888;font-size:11px">Band A = N209.5 - N225, Band B = N62, Band C = N52</p>
<select id="band"><option value="225">Band A - N225/kWh</option><option value="209.5">Band A Lagos - N209.5</option><option value="62.5">Band B - N62.5</option><option value="52">Band C - N52</option></select>
<input id="amount" type="number" placeholder="Amount e.g. 5000">
<button class="btn" onclick="calc()">Calculate Units</button><div id="out"></div>
<p style="font-size:10px;color:#555;margin-top:10px">Formula: Units = Amount / Tariff. For 5000 on Band A 225 = 22.2 units</p>
</div><script>function calc(){let amt=parseFloat(document.getElementById('amount').value)||0;let tariff=parseFloat(document.getElementById('band').value);let units=amt/tariff;document.getElementById('out').innerHTML=`<div class=res>${units.toFixed(2)} kWh Units<br><span style="color:#888;font-size:12px">₦${amt} / ₦${tariff} = ${units.toFixed(1)} units</span></div>`;}</script></body></html>
