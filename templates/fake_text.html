<script>
function addLine(p){ document.getElementById('msgs').value+='\n'+p; render(); }
function render(){
 let name=document.getElementById('cname').value||'Mom';
 let init=document.getElementById('cinit').value||'M';
 let time=document.getElementById('ctime').value||'9:41';
 document.getElementById('cn').innerText=name;
 document.getElementById('av').innerText=init.toUpperCase();
 document.getElementById('stime').innerText=time;
 let raw=document.getElementById('msgs').value.split('\n').filter(x=>x.trim()!='');
 let html='';
 raw.forEach(line=>{
  let isMe=line.toLowerCase().startsWith('me:');
  let isThem=line.toLowerCase().startsWith(name.toLowerCase()+':') || line.toLowerCase().startsWith('mom:') || line.toLowerCase().startsWith('gf:') || line.toLowerCase().startsWith('boss:');
  let text=line.split(':').slice(1).join(':').trim();
  if(!text) text=line;
  if(isMe){
   html+=`<div class="bubble me">${escapeHtml(text)}</div>`;
  }else{
   html+=`<div class="bubble them">${escapeHtml(text)}</div>`;
  }
 });
 document.getElementById('chat').innerHTML=html;
}
function escapeHtml(t){
 return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function download(){
 html2canvas(document.getElementById('screen'),{scale:3,useCORS:true}).then(c=>{
  let a=document.createElement('a');
  a.download='fake-text-story.png';
  a.href=c.toDataURL('image/png');
  a.click();
 });
}
render();
</script>
