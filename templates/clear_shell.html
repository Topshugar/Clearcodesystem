<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearShell - ClearCode</title>
<style>
body{margin:0;background:#0A0A0A;color:#00FF88;font-family:monospace}
.header{padding:15px;background:#111;border-bottom:1px solid #00FF8833}
input{padding:12px;background:#111;color:#fff;border:1px solid #333;border-radius:6px}
#term{background:#000;border:1px solid #00FF8833;padding:15px;height:340px;overflow:auto;white-space:pre-wrap;margin:15px;border-radius:8px}
.btn{padding:12px 20px;background:#00FF88;color:#000;border:0;font-weight:bold;border-radius:6px}
</style>
</head>
<body>
<div class="header">
<a href="/" style="color:#888;text-decoration:none">< Back</a>
<h2>> ClearShell_ <span style="font-size:12px;color:#888">Tool 12</span></h2>
</div>
<div style="padding:15px">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="host" placeholder="VPS IP" style="flex:1">
<input id="user" value="root" style="width:80px">
<input id="pass" type="password" placeholder="Password" style="flex:1">
</div>
<div id="term">$ ClearShell ready... Connect VPS from phone</div>
<div style="display:flex;gap:8px;margin-top:10px">
<input id="cmd" placeholder="ls" style="flex:1;color:#0F0;background:#000;border-color:#00FF88">
<button class="btn" onclick="run()">SEND</button>
</div>
</div>
<script>
async function run(){
 let host=document.getElementById('host').value.trim();
 let user=document.getElementById('user').value.trim()||'root';
 let pass=document.getElementById('pass').value;
 let cmd=document.getElementById('cmd').value.trim();
 if(!host||!pass||!cmd) return alert('Fill IP, Pass, Command');
 let term=document.getElementById('term');
 term.innerHTML += `\n\n$ ${cmd}\n> connecting ${host}...`;
 let res = await fetch('/api/clear-shell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host,user,pass,cmd})});
 let data = await res.json();
 term.innerHTML += `\n${data.output}`;
 term.scrollTop = term.scrollHeight;
 document.getElementById('cmd').value='';
}
</script>
</body>
</html>
