<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ClearCodeSystem{% endblock %}</title>
<!-- Monetag - Keep only 1 tag -->
<script src="https://al5sm.com/tag.min.js" data-zone="8972356" async data-cfasync="false"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
a{text-decoration:none;color:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #1a1a1a;max-width:1100px;margin:0 auto}
.logo{font-weight:900;font-size:18px}
.logo span{color:#00FF88}
.live-badge{background:#111;border:1px solid #222;padding:6px 12px;border-radius:20px;font-size:11px}
.container{max-width:1100px;margin:0 auto;padding:16px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
<div class="logo"><span>ClearCode</span>System</div>
<div style="display:flex;gap:8px">
<div class="live-badge">{{ tools|length if tools is defined else '28' }} LIVE</div>
<a href="https://wa.me/2348060000000" style="background:#25D366;color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700">WhatsApp</a>
</div>
</div>
{% block content %}{% endblock %}
</body>
</html>
