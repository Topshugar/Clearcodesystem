</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>🎓 GPA Calculator Saudi</h2><select id="scale"><option value="5">5.0 Scale (Saudi)</option><option value="4">4.0 Scale</option></select><input id="credits" placeholder="Total Credits e.g. 120"><input id="points" placeholder="Total Points e.g. 450"><button class="btn" onclick="calc()">Calculate GPA</button><div id="out" style="margin-top:12px;font-size:20px;font-weight:900;color:#00FF88"></div></div><script>function calc(){let c=parseFloat(document.getElementById('credits').value)||1;let p=parseFloat(document.getElementById('points').value)||0;let gpa=p/c;document.getElementById('out').innerText='GPA: '+gpa.toFixed(2)+' / '+document.getElementById('scale').value;}</script></body></html>
