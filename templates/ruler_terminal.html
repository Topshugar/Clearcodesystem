<style>
body{background:#000;color:#0f0;font-family:monospace;padding:15px;margin:0}
.top{border-bottom:1px solid #222;padding:10px 0;margin-bottom:10px;display:flex;justify-content:space-between}
#out{background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:12px;min-height:300px;white-space:pre-wrap;font-size:13px;overflow:auto}
input{width:100%;padding:12px;background:#0f0f0f;color:#0f0;border:1px solid #222;border-radius:8px;margin-top:10px;font-family:monospace}

<div class="top"><a href="/">← System</a><span style="color:#666;font-size:12px">Tool 02: Ruler Terminal</span></div>
<div id="out">Type 'help' for commands...</div>
<input id="cmd" placeholder="Enter command e.g ls, pwd, date, echo hello" onkeydown="if(event.key==='Enter')run()">
<script>
async function run(){
 let c=document.getElementById('cmd').value; if(!c)return;
 let o=document.getElementById('out'); o.textContent+='\n> '+c;
 const r=await fetch('/api/ruler-terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:c})});
 const d=await r.json();
 if(d.output==='__CLEAR__') o.textContent=''; else o.textContent+='\n'+d.output;
 document.getElementById('cmd').value=''; o.scrollTop=o.scrollHeight;
}
</script>
