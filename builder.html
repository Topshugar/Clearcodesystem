<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Builder - Free Online Store Link for WhatsApp | Nigeria</title>
<meta name="description" content="Create free online store link for your business in 30 seconds - No coding, share on WhatsApp">
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px}
.header{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900;font-size:18px}.logo span{color:#00FF88}.back{color:#888;text-decoration:none;font-size:12px;border:1px solid #222;padding:6px 12px;border-radius:20px}
.wrap{max-width:900px;margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}}
.card{background:#121212;border:1px solid #222;border-radius:18px;padding:18px}
.card h2{font-size:14px;margin-bottom:12px} .card h2 span{color:#00FF88}
label{font-size:10px;color:#888;display:block;margin:10px 0 4px;font-weight:800;letter-spacing:0.5px}
input,textarea{width:100%;background:#080808;border:1px solid #222;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;outline:none}
input:focus,textarea:focus{border-color:#00FF88}
.btn{background:#00FF88;color:#000;border:0;padding:12px 16px;border-radius:12px;font-weight:900;width:100%;cursor:pointer;margin-top:12px;font-size:13px}
.btn2{background:#222;color:#fff;border:0;padding:8px 12px;border-radius:10px;font-weight:800;cursor:pointer;font-size:11px;margin-top:8px}
.prod{background:#080808;border:1px dashed #333;border-radius:12px;padding:10px;margin-top:10px;display:flex;gap:8px}
.prod input{font-size:12px}
.preview{background:#fff;color:#000;border-radius:18px;padding:0;overflow:hidden;min-height:400px}
.p-head{background:#000;color:#fff;padding:14px;text-align:center}.p-head b{color:#00FF88}
.p-body{padding:14px} .p-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.p-item:last-child{border:0} .price{font-weight:900}
.link-box{margin-top:12px;background:#080808;border:1px solid #00FF88;border-radius:12px;padding:10px;font-size:11px;word-break:break-all;color:#00FF88}
</style>
</head>
<body>
<div class="header"><div class="logo">ClearCode<span>System</span></div><a href="/" class="back">← Home</a></div>

<div class="wrap">
<div class="card">
<h2>🏪 BUILD YOUR <span>STORE IN 30 SEC</span></h2>
<label>Shop Name</label><input id="shop" placeholder="Mama Chioma Store" value="Mama Chioma Fashion">
<label>WhatsApp Number</label><input id="wa" placeholder="2348165043865" value="2348165043865">
<label>Shop Slogan</label><input id="slogan" placeholder="Best Prices in Lagos" value="Best Prices in Lagos Market">

<div id="products"></div>
<button class="btn2" onclick="addProd()">+ Add Product</button>
<button class="btn" onclick="generate()">GENERATE STORE LINK →</button>
<div id="link" class="link-box" style="display:none"></div>
</div>

<div class="card preview" id="preview">
<div class="p-head"><b id="p-shop">Mama Chioma Fashion</b><br><span id="p-slogan" style="font-size:11px;color:#888">Best Prices in Lagos Market</span></div>
<div class="p-body" id="p-list"></div>
<div style="padding:14px"><a id="p-wa" href="#" class="btn" style="display:block;text-align:center;text-decoration:none">Chat on WhatsApp to Order</a></div>
</div>
</div>

<script>
let prods = [
{name:"Abaya Dubai", price:15000},
{name:"Hand Bag", price:8000},
{name:"Slippers", price:5000}
];
function addProd(n='',p=''){
  prods.push({name:n, price:p});
  renderInputs();
}
function renderInputs(){
  const div = document.getElementById('products');
  div.innerHTML = '<label>Products</label>';
  prods.forEach((pr,i)=>{
    div.innerHTML += `<div class="prod"><input value="${pr.name}" placeholder="Product name" oninput="prods[${i}].name=this.value;genPreview()"><input type="number" value="${pr.price}" placeholder="Price" style="width:100px" oninput="prods[${i}].price=this.value;genPreview()"><button onclick="prods.splice(${i},1);renderInputs();genPreview()" style="background:#ff4444;color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer">x</button></div>`;
  });
  genPreview();
}
function genPreview(){
  document.getElementById('p-shop').innerText = document.getElementById('shop').value || 'Your Shop';
  document.getElementById('p-slogan').innerText = document.getElementById('slogan').value || '';
  let wa = document.getElementById('wa').value.replace(/\D/g,'');
  document.getElementById('p-wa').href = `https://wa.me/${wa}?text=Hi, I want to order from your store`;
  let html='';
  let total=0;
  prods.forEach(pr=>{
    if(!pr.name) return;
    let price = parseInt(pr.price)||0;
    total+=price;
    html+=`<div class="p-item"><span>${pr.name}</span><span class="price">₦${price.toLocaleString()}</span></div>`;
  });
  html+=`<div class="p-item" style="font-weight:900;border-top:2px solid #000"><span>Total Value</span><span>₦${total.toLocaleString()}</span></div>`;
  document.getElementById('p-list').innerHTML = html;
}
function generate(){
  genPreview();
  let shop = document.getElementById('shop').value.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'');
  let link = `https://clearcodesystem.onrender.com/store/${shop}`;
  document.getElementById('link').style.display='block';
  document.getElementById('link').innerHTML = `✅ Your Store Link:<br><b>${link}</b><br><br>Share this on WhatsApp Status — customers will order via WhatsApp button. Copy and post!`;
  window.scrollTo(0,0);
}
renderInputs();
document.getElementById('shop').addEventListener('input', genPreview);
document.getElementById('slogan').addEventListener('input', genPreview);
document.getElementById('wa').addEventListener('input', genPreview);
</script>
</body>
</html>
