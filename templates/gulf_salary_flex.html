<!DOCTYPE html>
<html lang="{{ 'ar' if country in ['SA','QA','AE','KW','BH','OM'] else 'en' }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if country in ['SA','QA','AE','KW','BH','OM'] %}راتب فلكس - شف راتبك وانت نايم 😂 | Salary Flex {{country}}{% else %}Salary Flex - Earn While Sleeping Calculator {{country}} | ClearCode{% endif %}</title>
<meta name="description" content="Salary flex meme - calculate how much you earn while sleeping, eating. Viral in {{country_name}}">
<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px;max-width:500px;margin:auto}.card{background:#121212;border:1px solid #222;border-radius:18px;padding:20px;margin-top:20px}input{width:100%;padding:12px;border-radius:10px;background:#0a0a0a;border:1px solid #222;color:#fff;margin:8px 0}button{width:100%;padding:14px;background:#00FF88;color:#000;border:0;border-radius:12px;font-weight:900} .result{margin-top:16px;background:#00FF8822;border:1px solid #00FF88;padding:14px;border-radius:12px;display:none} .share{display:flex;gap:8px;margin-top:12px} .share a{flex:1;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:900;font-size:12px} .wa{background:#25D366;color:#fff} .snap{background:#FFFC00;color:#000}</style>
<!-- Monetag In-Page Push -->
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>
<h1 style="font-weight:900">💸 Salary Flex <span style="color:#00FF88">{{country_name}}</span></h1>
<p style="color:#888;font-size:12px">{{country}} • LIVE • Earn while sleeping meme - viral Gulf</p>
<div class="card">
<input id="salary" type="number" placeholder="Monthly Salary - {{ 'QAR' if country=='QA' else 'SAR' if country=='SA' else 'AED' if country=='AE' else 'KWD' if country=='KW' else 'BHD' if country=='BH' else 'OMR' if country=='OM' else '₦' }}">
<input id="hours" type="number" value="8" placeholder="Sleep hours">
<button onclick="calc()">CALCULATE MY FLEX 🔥</button>
<div id="res" class="result"></div>
<div id="share" class="share" style="display:none">
<a id="waShare" class="wa" href="#">WhatsApp</a>
<a id="snapShare" class="snap" href="#">Snapchat</a>
</div>
</div>
<script>
function calc(){
 let s=parseFloat(document.getElementById('salary').value)||0; let h=parseFloat(document.getElementById('hours').value)||8;
 if(s<=0) return alert('Enter salary');
 let perSec = s/30/24/3600; let earn = perSec*h*3600;
 let cur = "{{ 'QAR' if country=='QA' else 'SAR' if country=='SA' else 'AED' if country=='AE' else 'KWD' if country=='KW' else 'BHD' if country=='BH' else 'OMR' if country=='OM' else 'USD' if country in ['US','UK'] else 'NGN' }}";
 let txt = `While you slept ${h}h you earned <b style='color:#00FF88'>${earn.toFixed(2)} ${cur}</b> 😴💸<br>Per sec: ${(perSec).toFixed(4)} ${cur}`;
 document.getElementById('res').innerHTML=txt; document.getElementById('res').style.display='block';
 // VIRAL SHARE
 let shareText = `I earned ${earn.toFixed(2)} ${cur} while sleeping ${h}h 😂💸 Calculate yours: https://clearcodesystem.onrender.com/tool/salary-flex?country={{country}}&ref=viral`;
 document.getElementById('waShare').href=`https://wa.me/?text=${encodeURIComponent(shareText)}`;
 document.getElementById('snapShare').href=`https://www.snapchat.com/scan?attachmentUrl=${encodeURIComponent(shareText)}`;
 document.getElementById('share').style.display='flex';
 // Monetag Interstitial trigger (replace zone)
 try{ if(window.vignette) window.vignette.show(); }catch(e){}
}
</script>
<script>(function(s){s.dataset.zone='11988352',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
