<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ seo_title if seo_title else 'ClearCode System - Free Online Tools for Nigeria, Gulf, UK, USA' }}</title>
<meta name="description" content="{{ seo_desc if seo_desc else 'ClearCode System offers 100+ free online tools - NIN validator, salary calculator, gold price, rent splitter, invoice and more. Fast, secure, no signup.' }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://clearcode.system{{ request.path }}">
<meta property="og:title" content="{{ seo_title if seo_title else 'ClearCode System' }}">
<meta property="og:description" content="{{ seo_desc if seo_desc else '100+ free tools' }}">
<meta property="og:type" content="website">
<style>
body{font-family:Arial,sans-serif;background:#f5f5f7;margin:0;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:white;padding:16px;border-radius:12px;text-align:center;text-decoration:none;color:black;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card:hover{transform:translateY(-2px)}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
  </html>
