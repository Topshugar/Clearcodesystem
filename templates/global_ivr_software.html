<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVR Builder - AI Voice Menu | ClearCode</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui,sans-serif;padding:16px}
.card{max-width:700px;margin:0 auto;background:#121212;border:1px solid #222;border-radius:16px;padding:20px}
h1{font-size:22px;margin-bottom:6px}
.sub{color:#888;font-size:13px;margin-bottom:16px}
label{font-size:12px;color:#aaa;margin:12px 0 6px 0;display:block;text-transform:uppercase}
textarea,input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;font-size:14px}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px;font-size:14px}
.btn-green{background:#00FF88;color:#000}
.btn-dark{background:#222;color:#fff;border:1px solid #333}
.btn:disabled{opacity:0.5}
.pay-box{margin-top:18px;background:#0f1f15;border:1px solid #00FF8855;border-radius:12px;padding:14px}
.wallet{font-family:monospace;background:#000;padding:10px;border-radius:8px;font-size:11px;word-break:break-all;border:1px solid #333;margin:8px 0;color:#00FF88}
.badge{display:inline-block;background:#00FF88;color:#000;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
.preview{margin-top:14px;background:#1a1a1a;border-radius:10px;padding:12px;font-size:13px;color:#ccc;white-space:pre-wrap}
.small{font-size:11px;color:#666;margin-top:8px}
.ok{color:#00FF88} .err{color:#ff4444}
</style>
</head>
<body>
<div class="card">
<h1>📞 IVR Builder <span class="badge">5 USDT TRC20</span></h1>
<p class="sub">Build MTN-style voice menu • AI voice • Instant MP3 + Call Test<br>Country: {{country_name}} • {{country}}</p>

<label>Business Name</label>
<input id="biz" placeholder="e.g. ClearCode Logistics">

<label>IVR Script (What caller hears)</label>
<textarea id="script">Welcome to ClearCode Logistics. Press 1 for Sales, Press 2 for Support, Press 3 to speak with an agent. Thank you for calling.</textarea>

<div class="row">
<div>
<label>Voice</label>
<select id="voice">
<option value="en-NG">🇳🇬 Nigerian English</option>
<option value="en-US" selected>🇺🇸 US English</option>
<option value="en-GB">🇬🇧 UK English</option>
<option value="ar-SA">🇸🇦 Arabic</option>
</select>
</div>
<div>
<label>Type</label>
<select id="type">
<option value="simple">Simple MP3 - 5 USDT</option>
<option value="live">Live + Call Test - 5 USDT</option>
</select>
</div>
</div>

<button class="btn btn-dark" onclick="preview()">▶️ Preview Text</button>
<div id="preview" class="preview" style="display:none"></div>

<div class="pay-box">
<h3 style="font-size:14px">🔒 Unlock Download - Pay 5 USDT (TRC20)</h3>
<p class="small">Send exactly <b style="color:#fff">5 USDT TRC20</b> to:</p>
<div class="wallet" id="wallet">TRhMjNALZeUMK5cSkDXX7CgjdqJ4YNWVz4</div>
<button class="btn btn-dark" onclick="copyWallet()" style="margin-top:0;padding:8px;font-size:12px">📋 Copy Wallet</button>

<label>Enter Transaction ID / TxHash after payment</label>
<input id="txid" placeholder="Paste TRON TxID here (e.g. 9a8f...)">
<button class="btn btn-green" id="verifyBtn" onclick="verify()">✅ Verify Payment & Unlock MP3</button>
<p id="verifyMsg" class="small"></p>
</div>

<button class="btn btn-green" id="downloadBtn" onclick="downloadMp3()" disabled>⬇️ Download IVR MP3 (Locked)</button>

<div style="margin-top:16px;border-top:1px solid #222;padding-top:12px">
<label>Test Call (After Payment)</label>
<input id="phone" placeholder="+234 801 234 5678">
<button class="btn btn-dark" onclick="callTest()">📲 Send Test Call</button>
<p id="callMsg" class="small"></p>
</div>

<p class="small">API: /api/ivr/verify-usdt • Need help? WhatsApp ClearCode</p>
</div>

<script>
const WALLET = "TRhMjNALZeUMK5cSkDXX7CgjdqJ4YNWVz4";
let unlocked = false;

function preview(){
  const t = document.getElementById('script').value;
  const p = document.getElementById('preview');
  p.style.display='block';
  p.textContent = t;
}

function copyWallet(){
  navigator.clipboard.writeText(WALLET);
  alert("Wallet copied: "+WALLET);
}

async function verify(){
  const txid = document.getElementById('txid').value.trim();
  const type = document.getElementById('type').value;
  const msg = document.getElementById('verifyMsg');
  if(txid.length < 10){ msg.innerHTML='<span class=err>Enter valid TxID</span>'; return; }
  msg.textContent="Verifying on Tron...";
  document.getElementById('verifyBtn').disabled=true;
  try{
    const res = await fetch('/api/ivr/verify-usdt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({txid,type})});
    const data = await res.json();
    if(data.ok){
      unlocked=true;
      msg.innerHTML='<span class=ok>✅ '+data.msg+' Unlocked!</span>';
      document.getElementById('downloadBtn').disabled=false;
      document.getElementById('downloadBtn').textContent='⬇️ Download IVR MP3 (Unlocked)';
      document.getElementById('downloadBtn').style.background='#00FF88';
    }else{
      msg.innerHTML='<span class=err>❌ '+data.error+'</span>';
    }
  }catch(e){ msg.innerHTML='<span class=err>Network error</span>'; }
  document.getElementById('verifyBtn').disabled=false;
}

async function downloadMp3(){
  if(!unlocked){ alert("Pay 5 USDT first"); return; }
  const text = document.getElementById('script').value;
  const biz = document.getElementById('biz').value || "ClearCode";
  // For now demo mp3, later gTTS
  window.location = '/api/ivr/download?text='+encodeURIComponent(biz+": "+text);
}

async function callTest(){
  if(!unlocked){ alert("Pay first"); return; }
  const phone = document.getElementById('phone').value;
  const text = document.getElementById('script').value;
  const msg = document.getElementById('callMsg');
  if(!phone){ msg.textContent="Enter phone"; return; }
  msg.textContent="Queuing call...";
  const res = await fetch('/api/ivr/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,text})});
  const data = await res.json();
  msg.textContent = data.ok ? "✅ "+data.msg : "❌ "+data.error;
}
</script>
</body>
</html>
