<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Calculator for Vendors - ClearCode Systems</title>
<meta name="description" content="Free profit calculator for IG vendors in Nigeria. Calculate real profit after delivery, packaging, ads.">
<script src="https://al5sm.com/tag.min.js" data-zone="11970643" async data-cfasync="false"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#f8fafc;color:#0f172a;padding:15px}
.container{max-width:500px;margin:0 auto;background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.08);overflow:hidden}
.header{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;padding:25px;text-align:center}
.header h1{font-size:22px;margin-bottom:5px}
.header p{opacity:0.9;font-size:13px}
.content{padding:20px}
label{font-size:13px;font-weight:700;margin-top:12px;display:block;color:#334155}
input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:12px;margin-top:6px;font-size:16px;outline:none}
input:focus{border-color:#7c3aed}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;border:none;padding:16px;border-radius:12px;font-weight:800;font-size:16px;margin-top:18px;cursor:pointer}
.result{margin-top:20px;background:#f5f3ff;border:2px dashed #7c3aed;border-radius:16px;padding:18px;display:none}
.result.show{display:block}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ede9fe;font-size:14px}
.row:last-child{border:none}
.profit-big{text-align:center;padding:15px 0}
.profit-big h2{font-size:32px;color:#7c3aed}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;margin-top:5px}
.badge.good{background:#dcfce7;color:#166534}
.badge.bad{background:#fee2e2;color:#991b1b}
.footer{text-align:center;padding:15px;font-size:11px;color:#94a3b8}
a{color:#7c3aed;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>💰 Vendor Profit Calculator</h1>
<p>Know your REAL profit — not fake profit</p>
</div>
<div class="content">
<label>Cost Price (₦) — How much you buy it</label>
<input type="number" id="cost" placeholder="e.g 3500">

<label>Selling Price (₦) — How much you sell</label>
<input type="number" id="selling" placeholder="e.g 7000">

<label>Delivery / Waybill (₦)</label>
<input type="number" id="delivery" placeholder="e.g 500" value="0">

<label>Packaging / Nylon / Branding (₦)</label>
<input type="number" id="pack" placeholder="e.g 200" value="0">

<label>Ads / Data / Boosting Cost (₦)</label>
<input type="number" id="ads" placeholder="e.g 300" value="0">

<button class="btn" onclick="calc()">Calculate My Real Profit</button>

<div class="result" id="result">
<div class="profit-big">
<p style="font-size:12px;color:#64748b">YOUR REAL PROFIT</p>
<h2 id="profitVal">₦0</h2>
<span id="badge" class="badge"></span>
</div>
<div class="row"><span>Total Expenses</span><b id="expVal">₦0</b></div>
<div class="row"><span>Profit Margin</span><b id="marginVal">0%</b></div>
<div class="row"><span>Return Advice</span><b id="adviceVal"></b></div>
<p style="margin-top:12px;font-size:12px;color:#64748b;text-align:center">Share this tool: clearcodesystem.onrender.com/tools/profit-calculator</p>
</div>
</div>
<div class="footer">
Built by <a href="/">ClearCode Systems</a> — Tools for Nigerian Hustlers from Jos
</div>
</div>

<script>
function calc(){
let cost = parseFloat(document.getElementById('cost').value) || 0;
let selling = parseFloat(document.getElementById('selling').value) || 0;
let delivery = parseFloat(document.getElementById('delivery').value) || 0;
let pack = parseFloat(document.getElementById('pack').value) || 0;
let ads = parseFloat(document.getElementById('ads').value) || 0;

if(cost==0 || selling==0){alert('Enter cost and selling price');return;}

let expenses = delivery + pack + ads;
let totalCost = cost + expenses;
let profit = selling - totalCost;
let margin = (profit / selling * 100).toFixed(1);

document.getElementById('result').classList.add('show');
document.getElementById('profitVal').innerText = '₦' + profit.toLocaleString();
document.getElementById('expVal').innerText = '₦' + expenses.toLocaleString();
document.getElementById('marginVal').innerText = margin + '%';

let badge = document.getElementById('badge');
let advice = document.getElementById('adviceVal');

if(profit <= 0){
badge.innerText = 'LOSS ❌';
badge.className = 'badge bad';
advice.innerText = 'You are losing! Increase price';
advice.style.color = '#dc2626';
}else if(margin < 20){
badge.innerText = 'LOW PROFIT ⚠️';
badge.className = 'badge bad';
advice.innerText = 'Add small money, at least 30% margin';
advice.style.color = '#ea580c';
}else{
badge.innerText = 'GOOD PROFIT ✅';
badge.className = 'badge good';
advice.innerText = 'Solid! Keep selling';
advice.style.color = '#16a34a';
}
}
</script>
</body>
  </html>
