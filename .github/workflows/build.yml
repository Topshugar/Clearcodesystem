name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ || true
          mv lib bin NOTICE.txt source.properties latest/ || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create WebView Project
        run: |
          mkdir -p apk_template/app/src/main/java/com/clearcode/app
          mkdir -p apk_template/app/src/main/res/mipmap
          cat > apk_template/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.clearcode.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="ClearCode App" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > apk_template/app/src/main/java/com/clearcode/app/MainActivity.java << 'EOF'
          package com.clearcode.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("https://google.com");
                  setContentView(wv);
              }
          }
          EOF
          cat > apk_template/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.clearcode.app'; compileSdk 34; defaultConfig { applicationId "com.clearcode.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" } }
          EOF
          cat > apk_template/build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > apk_template/settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > apk_template/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

      - name: Build APK
        run: |
          cd apk_template
          chmod +x gradlew || (gradle wrapper)
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearCode-APK-Direct-Download
          path: apk_template/app/build/outputs/apk/debug/app-debug.apk
