<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruler Terminal - ClearCode</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:monospace;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;padding:10px 15px;background:#080808;border-bottom:1px solid #1a1a1a;font-family:Arial}
.ruler-h{height:24px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:end;overflow:hidden;position:relative}
.ruler-h span{position:absolute;bottom:0;font-size:9px;color:#555;border-left:1px solid #333;padding-left:2px;height:14px}
.ruler-h.long{height:20px;color:#888}
.body{display:flex;height:calc(100vh - 70px)}
.ruler-v{width:24px;background:#0a0a0a;border-right:1px solid #222;display:flex;flex-direction:column;position:relative}
.ruler-v span{position:absolute;left:0;font-size:9px;color:#555;border-top:1px solid #333;padding-top:1px;width:14px;text-align:right}
.ruler-v.long{width:20px;color:#888}
#screen{flex:1;background:#050505;padding:15px;overflow:auto}
#out{white-space:pre-wrap;font-size:13px;line-height:1.6;color:#ccc}
.input{display:flex;align-items:center;margin-top:12px;border-top:1px solid #111;padding-top:10px}
.prompt{color:#3b82f6;margin-right:8px}
#cmd{background:transparent;border:none;color:#00ff88;outline:none;width:100%;font-family:monospace;font-size:14px}
.crosshair{position:fixed;width:1px;height:1px;background:transparent;pointer-events:none;z-index:99}
#hLine{position:fixed;left:0;height:1px;background:rgba(59,130,246,0.3);pointer-events:none}
#vLine{position:fixed;top:0;width:1px;background:rgba(59,130,246,0.3);pointer-events:none}
#coords{position:fixed;bottom:10px;right:10px;background:#111;border:1px solid #222;padding:4px 8px;font-size:11px;border-radius:6px;color:#3b82f6}
</style></head>
<body>
<div class="top-bar">
<a href="/" style="color:#3b82f6;text-decoration:none;">← Back to System</a>
<span>📏 RULER TERMINAL — Tool 02</span>
<span style="color:#444;font-size:11px;" id="sizeInfo">0 x 0 px</span>
</div>
<div class="ruler-h" id="rulerH"></div>
<div class="body">
<div class="ruler-v" id="rulerV"></div>
<div id="screen">
<div id="out">ClearCode Ruler Terminal v1.0
Type 'help' to see commands. Move mouse to measure pixels.

</div>
<div class="input"><span class="prompt">➜</span><input id="cmd" autofocus placeholder="type command..."></div>
</div>
</div>
<div id="hLine"></div><div id="vLine"></div>
<div id="coords">x:0 y:0</div>

<script>
const rulerH=document.getElementById('rulerH');
const rulerV=document.getElementById('rulerV');
for(let i=0;i<2000;i+=10){
  const s=document.createElement('span');
  s.style.left=i+'px';
  s.textContent=i%100==0?i:'';
  if(i%100==0) s.classList.add('long');
  rulerH.appendChild(s);
}
for(let i=0;i<2000;i+=10){
  const s=document.createElement('span');
  s.style.top=i+'px';
  s.textContent=i%100==0?i:'';
  if(i%100==0) s.classList.add('long');
  rulerV.appendChild(s);
}
const hLine=document.getElementById('hLine');
const vLine=document.getElementById('vLine');
const coords=document.getElementById('coords');
document.addEventListener('mousemove',e=>{
  hLine.style.top=e.clientY+'px';
  vLine.style.left=e.clientX+'px';
  coords.textContent=`x:${e.clientX} y:${e.clientY} — w:${window.innerWidth-e.clientX}px`;
});
window.addEventListener('resize',()=>{document.getElementById('sizeInfo').textContent=window.innerWidth+' x '+window.innerHeight+' px'});

const out=document.getElementById('out');
const cmdInput=document.getElementById('cmd');
function add(t,c='#ccc'){const d=document.createElement('div');d.textContent=t;d.style.color=c;out.appendChild(d);out.parentElement.scrollTop=99999;}

cmdInput.addEventListener('keydown',async e=>{
 if(e.key==='Enter'){
  const cmd=cmdInput.value;
  add('➜ '+cmd,'#3b82f6');
  cmdInput.value='';
  if(!cmd) return;
  const res=await fetch('/api/ruler-terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
  const data=await res.json();
  if(data.output==='__CLEAR__'){out.innerHTML='';}
  else add(data.output);
 }
});
</script>
</body></html>
