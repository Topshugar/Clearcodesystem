</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>📝 WAEC / NECO Grader</h2>
<div id="subs"></div><button class="btn" onclick="calc()">Calculate WASSCE Result</button><div id="out"></div></div>
<script>let grades={'A1':5,'B2':4,'B3':3,'C4':2,'C5':1,'C6':0,'D7':0,'E8':0,'F9':0};let html='';for(let i=1;i<=9;i++){html+=`<select id=g${i}><option value="">Subject ${i} Grade</option><option>A1</option><option>B2</option><option>B3</option><option>C4</option><option>C5</option><option>C6</option><option>D7</option><option>E8</option><option>F9</option></select>`}document.getElementById('subs').innerHTML=html;function calc(){let count=0,points=0,fails=0;for(let i=1;i<=9;i++){let g=document.getElementById('g'+i).value;if(g){if(g=='F9')fails++;if(['A1','B2','B3','C4','C5','C6'].includes(g))count++;points+=grades[g]||0}}document.getElementById('out').innerHTML=`<div class=res>Credits (A1-C6): <b>${count}/9</b><br>Fail/Seize: ${fails}<br>Points: ${points}<br><b style=color:#00FF88>${count>=5?'Result: GOOD - 5 Credits ✅':'Need 5 Credits ❌'}</b></div>`;}</script></body></html>
