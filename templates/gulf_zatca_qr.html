<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px} .card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px} input{width:100%;padding:12px;border-radius:10px;background:#080808;border:1px solid #333;color:#fff;margin-top:8px} .btn{width:100%;padding:14px;background:#FFD700;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:12px}</style>
</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>🧾 ZATCA QR Fatoora</h2><input id="seller" placeholder="Seller Name"><input id="vat" placeholder="VAT 15 digits"><input id="total" type="number" placeholder="Total with VAT SAR"><input id="vatAmount" type="number" placeholder="VAT Amount SAR"><button class="btn" onclick="gen()">Generate QR</button><div id="qr" style="margin-top:12px;text-align:center"></div></div><script>async function gen(){let data=`Seller:${document.getElementById('seller').value} VAT:${document.getElementById('vat').value} Total:${document.getElementById('total').value}`;let r=await fetch('/api/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:data})});let j=await r.json();document.getElementById('qr').innerHTML=`<img src="${j.qr}" style="width:200px;border-radius:12px"><p style="color:#888;font-size:10px;margin-top:6px">Scan with ZATCA app</p>`;}</script></body></html>
