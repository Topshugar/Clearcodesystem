<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#121212;color:#fff;font-family:Inter,sans-serif}
.header{padding:14px;background:#0F0F0F;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}

.conn{display:flex;justify-content:space-between;align-items:center;background:#080808;border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:8px}

<div id="listView">
<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><h3 style="font-size:14px">Connections</h3><span style="font-size:10px;color:#00FF88">JuiceSSH Style</span></div>

<div class="conn"><div><span class="dot" style="background:#555"></span><b style="font-size:12px">my-hostinger</b><div style="font-size:10px;color:#888">u123@185.201.10.12:22</div></div><button onclick="connect('my-hostinger')" style="background:#222;color:#fff;border:0;padding:6px 12px;border-radius:20px;font-size:10px">CONNECT</button></div>

</div>

</div>
<script>
function connect(name){
document.getElementById('listView').style.display='none';
document.getElementById('termView').style.display='block';
let log=document.getElementById('termLog');
log.innerHTML=`> Connecting to ${name}...<br>> Host key verified [SHA256]<br>> SSH-2.0-OpenSSH_8.9<br>> Authentication success<br>> Welcome to Ubuntu 22.04 LTS - ClearCode VPS<br>> Uptime: 14 days - 4 vCPU 8GB RAM<br>> Type 'help' for quick commands<br><br>`;
}
const cmds={help:'ls, pwd, whoami, uptime, free, df, docker ps, git status, exit',ls:'app.py templates static Dockerfile',pwd:'/root/clearcodesystem',whoami:'root',uptime:'14 days - 99.99% VPS',free:'8GB RAM - 2GB used',df:'80G SSD - 68G free', 'docker ps':'clearcode-app Up 14 days - nginx', 'git status':'On main - 54 tools live', exit:'Closing connection...'};
document.getElementById('cmdIn').addEventListener('keydown',e=>{
if(e.key==='Enter'){let v=e.target.value.trim(); if(!v) return;
let log=document.getElementById('termLog');
log.innerHTML+=`<div>root@vps:~# ${v}</div>`;
if(v==='clear'){log.innerHTML='';} else if(v==='exit'){document.getElementById('termView').style.display='none';document.getElementById('listView').style.display='block';}
else{let out=cmds[v.toLowerCase()]||`bash: ${v}: command not found`; log.innerHTML+=`<div>> ${out}</div>`;}
e.target.value=''; document.getElementById('termView').scrollTop=9999;
}
});
</script>
