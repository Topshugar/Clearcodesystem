name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Smart Base APK
        run: |
          rm -rf apk_template
          mkdir -p apk_template/app/src/main/java/com/clearcode/app
          mkdir -p apk_template/app/src/main/assets
          echo '{"url":"https://example.com","app_name":"ClearCode"}' > apk_template/app/src/main/assets/config.json
          cat > apk_template/settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > apk_template/build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > apk_template/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android { compileSdkVersion 34; defaultConfig { applicationId "com.clearcode.app"; minSdkVersion 21; targetSdkVersion 34; versionCode 1; versionName "1.0" }; buildTypes { release { minifyEnabled false } }; namespace 'com.clearcode.app' }
          EOF
          cat > apk_template/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="ClearCode" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > apk_template/app/src/main/java/com/clearcode/app/MainActivity.java << 'EOF'
          package com.clearcode.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          import java.io.InputStream; import org.json.JSONObject;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  String url = "https://example.com";
                  try {
                      InputStream is = getAssets().open("config.json");
                      byte[] buffer = new byte[is.available()]; is.read(buffer); is.close();
                      JSONObject obj = new JSONObject(new String(buffer));
                      url = obj.getString("url");
                  } catch (Exception e) {}
                  WebView wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl(url);
                  setContentView(wv);
              }
          }
          EOF
          cd apk_template
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          ./gradle-8.0/bin/gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearCode-APK-Direct
          path: apk_template/app/build/outputs/apk/debug/*.apk
