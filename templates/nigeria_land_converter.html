<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px} .card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px} input,select{width:100%;padding:12px;border-radius:10px;background:#080808;border:1px solid #333;color:#fff;margin-top:8px} .btn{width:100%;padding:14px;background:#00FF88;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:12px} .res{margin-top:12px;background:#080808;border:1px solid #00FF88;border-radius:12px;padding:12px}</style>
</head><body><a href="/" style="color:#00FF88">← Home</a><div class="card"><h2>🏞️ Land Converter NG</h2>
<select id="std"><option value="600">Lagos Standard - 600 sqm = 1 plot</option><option value="450">Ibadan/Oyo - 450 sqm = 1 plot</option><option value="500">Abuja - 500 sqm = 1 plot</option></select>
<input id="plot" type="number" placeholder="Plots e.g. 2" value="1">
<input id="price" type="number" placeholder="Price per plot ₦ e.g. 2000000">
<button class="btn" onclick="calc()">Convert</button><div id="out"></div>
</div><script>function calc(){let std=parseFloat(document.getElementById('std').value);let plots=parseFloat(document.getElementById('plot').value)||1;let price=parseFloat(document.getElementById('price').value)||0;let sqm=plots*std, acre=sqm/4046.86, hect=sqm/10000;let total=plots*price;document.getElementById('out').innerHTML=`<div class=res>${sqm.toLocaleString()} sqm<br>${acre.toFixed(3)} Acre<br>${hect.toFixed(4)} Hectare<br><br><b style=color:#00FF88>Total: ₦${total.toLocaleString()}</b></div>`;}</script></body></html>
