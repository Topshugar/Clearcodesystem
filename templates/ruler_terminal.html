<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruler Terminal V2 - Fake Hacker Terminal for Content</title>
<script>(function(s){s.dataset.zone='11970643',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>body{margin:0;background:#000;color:#00FF88;font-family:monospace}#term{padding:15px;height:90vh;overflow:auto}input{background:#000;color:#00FF88;border:0;outline:0;width:80%;font-family:monospace}</style>
</head>
<body>
<div id="term">> Ruler Terminal V2 - Type 'help' for commands<br>> Monetag Active - Zone 11970643<br><br></div>
<div style="padding:10px;background:#111;display:flex"><span>> </span><input id="cmd" autofocus placeholder="type help"></div>
<script>
const term=document.getElementById('term');const cmdI=document.getElementById('cmd');
cmdI.addEventListener('keydown',async e=>{if(e.key==='Enter'){let cmd=cmdI.value;term.innerHTML+=`> ${cmd}<br>`;try{let r=await fetch('/api/ruler-terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});let d=await r.json();if(d.output==='__CLEAR__')term.innerHTML='';else term.innerHTML+=`${d.output}<br>`;}catch(e){term.innerHTML+=`Error<br>`;}term.scrollTop=term.scrollHeight;cmdI.value='';}});
</script>
</body>
</html>
