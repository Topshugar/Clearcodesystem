<style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;padding:16px}.card{background:#121212;border:1px solid #222;border-radius:16px;padding:16px;max-width:500px;margin:auto} select{width:100%;padding:12px;border-radius:8px;background:#080808;border:1px solid #333;color:#fff;margin-top:8px}.btn{width:100%;padding:14px;background:#FFD700;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}.res{margin-top:12px;background:#080808;border:1px solid #FFD700;border-radius:12px;padding:12px;line-height:1.6}</style>
</head><body><a href="/" style="color:#FFD700">← Home</a><div class="card"><h2>📝 WAEC Calculator 2026</h2><p style="font-size:11px;color:#888;margin-top:4px">Select your 9 WAEC grades to check university requirement</p><div id="subs"></div><button class="btn" onclick="calc()">Calculate WAEC Result</button><div id="out"></div></div>
<script>let grades={'A1':5,'B2':4,'B3':3,'C4':2,'C5':1,'C6':0,'D7':0,'E8':0,'F9':0};let subjects=["English","Maths","Subject 3","Subject 4","Subject 5","Subject 6","Subject 7","Subject 8","Subject 9"];let html='';for(let i=1;i<=9;i++){html+=`<select id=g${i}><option value="">${subjects[i-1]} - Grade</option><option>A1</option><option>B2</option><option>B3</option><option>C4</option><option>C5</option><option>C6</option><option>D7</option><option>E8</option><option>F9</option></select>`}document.getElementById('subs').innerHTML=html;function calc(){let count=0,points=0,fails=0;for(let i=1;i<=9;i++){let g=document.getElementById('g'+i).value;if(g){if(g=='F9')fails++;if(['A1','B2','B3','C4','C5','C6'].includes(g))count++;points+=grades[g]||0}}document.getElementById('out').innerHTML=`<div class=res>Credits (A1-C6): <b>${count}/9</b><br>F9 Fails: ${fails}<br>Total Points: ${points}<br><br><b style=color:#FFD700>${count>=5?'✅ PASSED - You have 5 Credits for University':'❌ FAILED - Need 5 Credits (C6 and above)'}</b></div>`;}</script></body></html>
